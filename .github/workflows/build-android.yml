
name: Build QOLMod Android

on:
  workflow_dispatch:

jobs:
  inspect-project:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Inspect project files
        run: |
          echo "Checking project structure"
          ls -la
          find . -maxdepth 3 \
            \( -name CMakeLists.txt \
            -o -name mod.json \
            -o -name CMakePresets.json \) \
            -print
