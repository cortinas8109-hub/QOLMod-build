name: Build QOLMod Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'QOLMod-source.zip'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Extract QOLMod source
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          test -f QOLMod-source.zip || { echo "ERROR: QOLMod-source.zip is missing"; exit 1; }
          mkdir -p extracted
          unzip -q QOLMod-source.zip -d extracted
          MOD_JSON="$(find extracted -name mod.json -print -quit)"
          test -n "$MOD_JSON" || { echo "ERROR: mod.json not found in ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$MOD_JSON")"
          for item in CMakeLists.txt src include; do
            test -e "$PROJECT_DIR/$item" || { echo "ERROR: $item missing from source ZIP"; exit 1; }
          done
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Source project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -80

      - name: Restore upstream QOLMod resources and project files
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.locate.outputs.path }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.8.6 https://github.com/TheSillyDoggo/GeodeMenu.git upstream
          test -d upstream/resources || { echo "ERROR: upstream resources directory is missing"; exit 1; }
          # Use the project source/CMake from the supplied ZIP, and restore upstream resources
          # that are absent from the ZIP. The ZIP's CMake does not require the inaccessible RIFT repo.
          cp -a "$SOURCE_DIR/src" upstream/
          cp -a "$SOURCE_DIR/include" upstream/
          cp "$SOURCE_DIR/CMakeLists.txt" upstream/CMakeLists.txt
          cp "$SOURCE_DIR/mod.json" upstream/mod.json

          # The supplied ZIP intentionally contains source only. Rebuild a minimal English
          # localisation file from module metadata so names/categories remain readable even
          # when the upstream resource checkout has no translation JSON files.
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path("upstream")
          resources = root / "resources"
          resources.mkdir(parents=True, exist_ok=True)
          mod_path = root / "mod.json"
          mod = json.loads(mod_path.read_text())
          files = mod.setdefault("resources", {}).setdefault("files", [])
          if "resources/*.json" not in files:
              files.append("resources/*.json")
          mod_path.write_text(json.dumps(mod, indent=2) + "\n")

          strings = {}
          def put(path, value):
              parts = path.split("/")
              node = strings
              for part in parts[:-1]:
                  node = node.setdefault(part, {})
              node[parts[-1]] = value

          def humanize(value):
              value = value.rsplit("/", 1)[-1]
              value = re.sub(r"[-_]+", " ", value).strip()
              return " ".join(word[:1].upper() + word[1:] for word in value.split()) or "Module"

          categories = set()
          records = {}
          source_root = root / "src"
          for path in source_root.rglob("*"):
              if not path.is_file() or path.suffix not in {".cpp", ".hpp", ".h"}:
                  continue
              source = path.read_text(errors="replace")
              for match in re.finditer(r'setCategory\("([^"]+)"\)', source):
                  categories.add(match.group(1))
              ids = list(re.finditer(r'setID\("([^"]+)"\)', source))
              for i, match in enumerate(ids):
                  module_id = match.group(1)
                  end = ids[i + 1].start() if i + 1 < len(ids) else min(len(source), match.end() + 1200)
                  chunk = source[match.start():max(match.end(), end)]
                  name_match = re.search(r'setName\("([^"]+)"\)', chunk)
                  desc_match = re.search(r'setDescription\("([^"]+)"\)', chunk)
                  name = name_match.group(1) if name_match else humanize(module_id)
                  desc = desc_match.group(1) if desc_match else f"{name} module."
                  records[module_id] = (name, desc)

          # The language format nests IDs by slash. A parent module ID can also be a
          # prefix of its option IDs, so omit that parent key rather than corrupting
          # the JSON tree; its fallback label is still handled by the UI.
          ids_with_children = {module_id for module_id in records
                               if any(other.startswith(module_id + "/") for other in records)}
          for module_id, (name, desc) in records.items():
              if module_id in ids_with_children:
                  continue
              put("names/" + module_id, name)
              put("descriptions/" + module_id, desc)

          for category in categories | {"Level", "Universal", "Creator", "Cosmetic", "Speedhack", "Icon Effects", "Labels", "Shortcuts", "Config", "Search", "Favourites", "All Modules"}:
              put("categories/" + category.lower(), category)

          language = {
              "display_name_english": "English",
              "display_name_native": "English",
              "font": "notosans.fnt",
              "alt-font-usage": "Auto",
              "strings": strings
          }
          output = resources / "en-AU.json"
          output.write_text(json.dumps(language, ensure_ascii=False, indent=2) + "\n")
          names = strings.get("names", {})
          if len(names) < 20:
              raise SystemExit(f"ERROR: generated only {len(names)} module labels; refusing to build")
          print(f"Generated English fallback: {len(names)} module labels; {len(categories)} detected categories")
          PY
          echo "Overlaid supplied QOLMod source and project files; retained upstream resources."

          # onModify uses an auto parameter, so its template definition must be visible in the header.
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("upstream/src/Hacks/Utils/PlayLayer.hpp")
          source = Path("upstream/src/Hacks/Utils/PlayLayer.cpp")
          if not header.is_file() or not source.is_file():
              raise SystemExit("ERROR: PlayLayer header/source not found")
          h = header.read_text()
          declaration = "    static void onModify(auto& self);"
          definition = """    static void onModify(auto& self) {
                (void)self.setHookPriorityPost("PlayLayer::addObject", Priority::First);
                (void)self.setHookPriorityPost("PlayLayer::postUpdate", Priority::First);
            }"""
          if declaration in h:
              h = h.replace(declaration, definition, 1)
          elif "static void onModify(auto& self)" not in h or 'setHookPriorityPost("PlayLayer::addObject"' not in h:
              raise SystemExit("ERROR: Could not safely patch onModify declaration in PlayLayer.hpp")
          header.write_text(h)

          cpp = source.read_text()
          cpp, count = re.subn(
              r"\nvoid PlayLayerUtils::onModify\(auto& self\)\s*\{.*?\n\}\s*",
              "\n",
              cpp,
              count=1,
              flags=re.S,
          )
          if count == 1:
              source.write_text(cpp)
          elif "PlayLayerUtils::onModify" in cpp:
              raise SystemExit("ERROR: Found an unexpected onModify definition in PlayLayer.cpp")
          print("Patched PlayLayerUtils::onModify inline in PlayLayer.hpp")
          PY

          # Ensure noclip runs are always marked cheated, even if the player never visibly dies.
          # Auto Safe Mode then blocks saving level progress/rewards for that attempt.
          python3 - <<'PY'
          from pathlib import Path

          import re
          noclip = Path("upstream/src/Hacks/Level/Noclip/Noclip.hpp")
          text = noclip.read_text()
          replacement = """setSafeModeCustom([this]
          {
              // Any attempt with noclip enabled must be treated as cheated.
              return this->getRealEnabled();
          });"""
          updated, count = re.subn(
              r"setSafeModeCustom\(\[this\]\s*\{.*?\}\s*\);",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("ERROR: Could not locate Noclip Safe Mode callback")
          noclip.write_text(updated)

          # Enable the local icon/color unlock module by default.
          # This is a local bypass, not a permanent server-side account unlock.
          icons = Path("upstream/src/Hacks/Universal/UnlockAllIcons.cpp")
          text = icons.read_text()
          old = '            setDescription("Unlocks all the icons");'
          new = old + '\n            setDefaultEnabled(true);'
          if old in text and 'setDefaultEnabled(true);' not in text:
              text = text.replace(old, new, 1)
          elif old not in text:
              raise SystemExit("ERROR: Could not safely enable Unlock All Icons by default")
          icons.write_text(text)

          # Expose explicit registration helpers for modules whose source-local classes
          # cannot be referenced directly from AndroidUI.cpp.
          startpos = Path("upstream/src/Hacks/Level/StartposSwitcher.cpp")
          text = startpos.read_text()
          marker = "SUBMIT_HACK(StartposSwitcher);"
          helper = "void qolmod_force_register_startpos_switcher() { StartposSwitcher::get(); }\n\n"
          if marker not in text:
              raise SystemExit("ERROR: StartposSwitcher registration marker not found")
          if "qolmod_force_register_startpos_switcher" not in text:
              text = text.replace(marker, helper + marker, 1)
              startpos.write_text(text)

          icons = Path("upstream/src/Hacks/Universal/UnlockAllIcons.cpp")
          text = icons.read_text()
          marker = "SUBMIT_HACK(UnlockAllIcons);"
          helper = "void qolmod_force_register_unlock_all_icons() { UnlockAllIcons::get(); }\n\n"
          if marker not in text:
              raise SystemExit("ERROR: UnlockAllIcons registration marker not found")
          if "qolmod_force_register_unlock_all_icons" not in text:
              text = text.replace(marker, helper + marker, 1)
              icons.write_text(text)

          # Initialize key modules before AndroidUI enumerates Module::moduleMap.
          ui = Path("upstream/src/GUI/AndroidUI.cpp")
          text = ui.read_text()
          includes = [
              '#include "../Hacks/Level/Noclip/Noclip.hpp"',
              '#include "../Hacks/Level/Hitboxes/ShowHitboxes.hpp"',
              '#include "../Hacks/Level/CheckpointFix/CheckpointFix.hpp"',
          ]
          for include in includes:
              if include not in text:
                  text = include + "\n" + text
          init = """    // Force registration before building the category lists.
              (void)Noclip::get();
              (void)ShowHitboxes::get();
              (void)HitboxTrail::get();
              (void)CheckpointFix::get();
              qolmod_force_register_startpos_switcher();
              qolmod_force_register_unlock_all_icons();

          """
          marker = "void AndroidUI::populateModules()"
          if marker not in text:
              raise SystemExit("ERROR: AndroidUI::populateModules marker not found")
          if "qolmod_force_register_startpos_switcher();" not in text:
              pos = text.index("{", text.index(marker)) + 1
              text = text[:pos] + "\n" + init + text[pos:]
          declarations = "void qolmod_force_register_startpos_switcher();\nvoid qolmod_force_register_unlock_all_icons();\n\n"
          if "void qolmod_force_register_startpos_switcher();" not in text:
              text = declarations + text
          ui.write_text(text)

          # Make module categories visible even when they are absent from the hard-coded tab order.
          # populateModules() creates category nodes from registered modules; populateTabs() previously
          # only added tabs listed in categoryOrders, leaving other module categories unreachable.
          text = ui.read_text()
          extension_marker = "    for (qolmod::ext::CategoryData& cat : ExtensionManager::get()->getCategories())"
          dynamic_tabs = """    // Add tabs for registered module categories missing from the hard-coded order.
              for (auto const& entry : categories)
              {
                  bool alreadyOrdered = false;
                  for (auto const& ordered : categoryOrders)
                  {
                      if (ordered == entry.first)
                      {
                          alreadyOrdered = true;
                          break;
                      }
                  }
                  if (alreadyOrdered)
                      continue;

                  catMenu->addCategory(
                      entry.first,
                      fmt::format("{}{}.png", ""_spr, "universal"),
                      entry.first,
                      CategoryType::Standard
                  );
              }

          """
          if extension_marker not in text:
              raise SystemExit("ERROR: Could not find populateTabs extension category insertion point")
          if "Add tabs for registered module categories missing from the hard-coded order" not in text:
              text = text.replace(extension_marker, dynamic_tabs + extension_marker, 1)
              ui.write_text(text)
          print("Added explicit UI-time registration and dynamic tabs for all registered module categories")

          required = [
              "src/Hacks/Level/Noclip/Noclip.hpp",
              "src/Hacks/Level/Hitboxes/Modules.cpp",
              "src/Hacks/Speedhack/Speedhack.cpp",
              "src/SafeMode/Hooks.cpp",
              "src/Hacks/Universal/UnlockAllIcons.cpp",
              "src/Hacks/Level/CheckpointFix/CheckpointFix.hpp",
              "src/Hacks/Level/StartposSwitcher.cpp",
          ]
          missing = [p for p in required if not Path("upstream", p).is_file()]
          if missing:
              raise SystemExit("ERROR: Required QOLMod features are missing: " + ", ".join(missing))
          print("Verified required features: noclip, hitboxes, speedhack, safe mode, icon unlock, checkpoint fix, startpos switcher")
          PY

          # Add a guaranteed fallback tab containing every registered root module, independent of category labels.
          python3 - <<'PY'
          from pathlib import Path

          ui = Path("upstream/src/GUI/AndroidUI.cpp")
          text = ui.read_text()
          marker = "    m_mainLayer->addChild(categoryMenu);"
          fallback = """    // QOLMOD_ALL_MODULES_FALLBACK
              auto allModules = CategoryNode::getNode("All Modules");
              allModules->setID("All Modules");
              categories.emplace("All Modules", allModules);
              categoryMenu->addChildAtPosition(allModules, Anchor::Right, ccp(-10, 0));
              for (auto module : Module::moduleMap)
              {
                  if (!module || module->getParent())
                      continue;
                  allModules->addModule(module);
              }

          """
          if "QOLMOD_ALL_MODULES_FALLBACK" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("ERROR: Could not uniquely locate AndroidUI category menu insertion point")
              text = text.replace(marker, fallback + marker, 1)
              ui.write_text(text)
          print("Added All Modules fallback tab for every registered root module")
          PY

          echo "Prepared project files:"
          test -d upstream/resources
          test -d upstream/src
          test -d upstream/include
          test -f upstream/CMakeLists.txt
          test -f upstream/mod.json
          echo "Resource file count: $(find upstream/resources -type f | wc -l)"
          echo "Source file count: $(find upstream/src -type f | wc -l)"

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: upstream
          target: Android64
          sdk: given
          build-config: Release
          use-lto: false

      - name: Verify compiled package
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          set -euo pipefail
          echo "Build output: $OUTPUT_DIR"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -print
          find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.geode' | grep -q . || {
            echo "ERROR: build completed without producing a .geode package"
            exit 1
          }

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: QOLMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
