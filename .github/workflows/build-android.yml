
name: Build QOLMod Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract QOLMod source
        id: locate
        run: |
          unzip -q QOLMod-source.zip -d extracted

          MOD_JSON=$(find extracted -name mod.json -print -quit)

          if [ -z "$MOD_JSON" ]; then
            echo "ERROR: mod.json was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MOD_JSON")

          if [ ! -f "$PROJECT_DIR/CMakeLists.txt" ]; then
            echo "ERROR: CMakeLists.txt was not found"
            exit 1
          fi

          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ${{ steps.locate.outputs.path }}
          target: Android64
          sdk: given

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: QOLMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          
